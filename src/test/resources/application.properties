# Tests use an in-memory H2 database in MySQL compatibility mode, so they run
# without a MySQL server. The same schema.sql and demo seeder are used.
spring.datasource.url=jdbc:h2:mem:attendance;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
app.seed-demo-data=true
app.seed.admin-password=admin123
app.seed.teacher-password=teacher123
