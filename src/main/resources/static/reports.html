<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2F5D50">
    <link rel="icon" type="image/png" href="/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Attendance">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script src="/js/pwa.js" defer></script>
    <title>Reports · Attendance Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="main main-wide">
    <div class="page-header">
        <div>
            <h1>Class report</h1>
            <p>Attendance percentage of every student. Click a name for the student's details.</p>
        </div>
        <div class="toolbar">
            <a class="btn btn-primary" id="pdf-btn" href="#" download><i data-lucide="download"></i>PDF</a>
            <a class="btn" id="excel-btn" href="#" download><i data-lucide="sheet"></i>Excel</a>
            <a class="btn" id="csv-btn" href="#" download><i data-lucide="file-text"></i>CSV</a>
            <a class="btn" id="defaulters-btn" href="#" download><i data-lucide="user-x"></i>Defaulters (Excel)</a>
            <a class="btn" id="pdf-all-btn" href="#" download><i data-lucide="files"></i>All classes (PDF)</a>
            <button class="btn" id="print-btn" type="button"><i data-lucide="printer"></i>Print</button>
        </div>
    </div>

    <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="day" type="button">Day</button>
        <button class="tab" role="tab" data-tab="week" type="button">Week</button>
        <button class="tab" role="tab" data-tab="month" type="button">Month</button>
        <button class="tab" role="tab" data-tab="overall" type="button">Overall</button>
        <button class="tab" role="tab" data-tab="custom" type="button">Custom</button>
    </div>

    <div class="toolbar report-toolbar">
        <select class="input" id="class-select" aria-label="Class"></select>
        <input class="input" id="date-input" type="date" aria-label="Date">
        <input class="input" id="month-input" type="month" aria-label="Month">
        <span id="custom-inputs" class="toolbar">
            <input class="input" id="from-input" type="date" aria-label="From">
            <span class="muted">to</span>
            <input class="input" id="to-input" type="date" aria-label="To">
        </span>
        <select class="input" id="batch-filter" aria-label="Batch"></select>
        <label class="check"><input type="checkbox" id="defaulters-only">Defaulters only</label>
        <label class="check" id="parts-toggle"><input type="checkbox" id="show-parts">Theory / Lab</label>
    </div>

    <div id="facts" class="report-facts"></div>
    <div class="card flush">
        <div class="table-wrap">
            <table class="table report-table" id="table"></table>
        </div>
    </div>
    <p class="small muted" id="legend"></p>
</main>

<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js" integrity="sha384-ieG+IKD0d/ZPXyCBTMVAbqsQdns8QGJR/e26WMw7M4fkaI/rHcS/YIoi+ah9WGge" crossorigin="anonymous"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/sessions.js"></script>
<script src="/js/pages/reports.js"></script>
</body>
</html>
