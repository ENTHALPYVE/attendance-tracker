<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2F5D50">
    <link rel="icon" type="image/png" href="/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Attendance">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script src="/js/pwa.js" defer></script>
    <title>Student · Attendance Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="main">
    <a class="back-link" id="back-link" href="/reports.html"><i data-lucide="arrow-left"></i>Class report</a>
    <div class="page-header">
        <div>
            <h1 id="name">Student</h1>
            <p id="meta"></p>
        </div>
        <div class="toolbar">
            <div class="tabs tabs-inline" role="tablist">
                <button class="tab" role="tab" data-period="OVERALL" type="button">Overall</button>
                <button class="tab" role="tab" data-period="MONTH" type="button">Month</button>
            </div>
            <input class="input" id="month-input" type="month" aria-label="Month" hidden>
            <button class="btn" id="print-btn" type="button"><i data-lucide="printer"></i>Print</button>
        </div>
    </div>

    <section class="section summary-grid">
        <div class="card stat">
            <div class="label" id="period-label">Overall</div>
            <div class="value big"><span id="overall-pct">–</span><span class="unit">%</span></div>
            <div id="overall-status"></div>
        </div>
        <div class="card">
            <div class="label small muted">Sessions</div>
            <div class="value-line"><strong class="num" id="attended">0</strong> attended of <strong class="num" id="held">0</strong></div>
            <p id="advice" class="advice"></p>
        </div>
    </section>

    <section class="section card">
        <div class="section-head">
            <h2>Day by day</h2>
            <div class="cal-legend small">
                <span><i class="cal-swatch cal-safe"></i>Safe</span>
                <span><i class="cal-swatch cal-risk"></i>At risk</span>
                <span><i class="cal-swatch cal-low"></i>Below threshold</span>
                <span><i class="cal-swatch"></i>No sessions</span>
            </div>
        </div>
        <div id="calendar" class="calendar"></div>
        <p class="small muted" id="day-detail">Tap a day to see the details.</p>
    </section>

    <section class="section card flush">
        <div class="section-head pad"><h2>Subjects</h2></div>
        <div class="table-wrap">
            <table class="table">
                <thead>
                <tr><th>Subject</th><th class="num">Theory</th><th class="num">Lab</th><th class="num">Combined</th><th></th></tr>
                </thead>
                <tbody id="subjects"></tbody>
            </table>
        </div>
    </section>

    <section class="section chart-grid">
        <div class="card">
            <h2>Combined % by subject</h2>
            <div class="chart-box"><canvas id="subject-chart" aria-label="Combined attendance percentage by subject" role="img"></canvas></div>
        </div>
        <div class="card">
            <h2>Weekly trend</h2>
            <div class="chart-box"><canvas id="trend-chart" aria-label="Attendance percentage week by week" role="img"></canvas></div>
        </div>
    </section>
</main>

<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js" integrity="sha384-ieG+IKD0d/ZPXyCBTMVAbqsQdns8QGJR/e26WMw7M4fkaI/rHcS/YIoi+ah9WGge" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" integrity="sha384-bs/nf9FbdNouRbMiFcrcZfLXYPKiPaGVGplVbv7dLGECccEXDW+S3zjqSKR5ZEaD" crossorigin="anonymous"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/sessions.js"></script>
<script src="/js/pages/student.js"></script>
</body>
</html>
