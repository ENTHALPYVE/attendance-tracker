<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2F5D50">
    <link rel="icon" type="image/png" href="/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Attendance">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script src="/js/pwa.js" defer></script>
    <title>Teachers · Attendance Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="main">
    <div class="page-header">
        <div>
            <h1>Teachers</h1>
            <p>Teachers log in with their email and can mark attendance for their own sessions.</p>
        </div>
        <button class="btn btn-primary" id="add-btn" type="button"><i data-lucide="plus"></i>Add teacher</button>
    </div>

    <div class="card flush">
        <div class="table-wrap">
            <table class="table">
                <thead>
                <tr><th>Name</th><th>Email</th><th class="actions"></th></tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
    </div>
</main>

<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js" integrity="sha384-ieG+IKD0d/ZPXyCBTMVAbqsQdns8QGJR/e26WMw7M4fkaI/rHcS/YIoi+ah9WGge" crossorigin="anonymous"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/pages/admin-teachers.js"></script>
</body>
</html>
