<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2F5D50">
    <link rel="icon" type="image/png" href="/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Attendance">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script src="/js/pwa.js" defer></script>
    <title>Timetable · Attendance Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="main main-wide">
    <div class="page-header">
        <div>
            <h1>Timetable</h1>
            <p>Each slot holds one theory lecture for the whole class, or one lab per batch.</p>
        </div>
        <div class="toolbar">
            <select class="input" id="class-select" aria-label="Class"></select>
            <label class="check"><input type="checkbox" id="show-saturday">Saturday</label>
        </div>
    </div>

    <div class="card flush">
        <div class="table-wrap">
            <table class="tt-grid" id="grid"></table>
        </div>
    </div>
    <p>
        <button class="btn btn-sm" id="add-slot-btn" type="button"><i data-lucide="plus"></i>Add slot</button>
    </p>
</main>

<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/layout.js"></script>
<script>
    const esc = UI.esc;
    const DAYS = ['MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
    const DAY_LABEL = { MONDAY: 'Monday', TUESDAY: 'Tuesday', WEDNESDAY: 'Wednesday', THURSDAY: 'Thursday',
                        FRIDAY: 'Friday', SATURDAY: 'Saturday' };

    let classes = [], subjects = [], teachers = [];
    let tt = null;              // timetable of the selected class
    let slotCount = 0;          // rows shown

    const hhmm = (t) => t ? t.slice(0, 5) : '';

    // ------------------------------------------------------------ data helpers

    function entriesIn(day, slot) {
        return tt.entries.filter(e => e.dayOfWeek === day && e.slotNo === slot);
    }

    /** Usual times of a slot: taken from any entry already in that slot. */
    function slotTimes(slot) {
        const e = tt.entries.find(x => x.slotNo === slot);
        return e ? { start: hhmm(e.startTime), end: hhmm(e.endTime) } : { start: '', end: '' };
    }

    function visibleDays() {
        const sat = document.getElementById('show-saturday').checked;
        return sat ? DAYS : DAYS.slice(0, 5);
    }

    // ------------------------------------------------------------ drawing

    async function loadTimetable() {
        const classId = document.getElementById('class-select').value;
        tt = await Api.get(`/api/admin/classes/${classId}/timetable`);
        const maxSlot = tt.entries.reduce((m, e) => Math.max(m, e.slotNo), 0);
        slotCount = Math.max(slotCount, maxSlot, 5);   // keeps rows added with "Add slot"
        if (tt.entries.some(e => e.dayOfWeek === 'SATURDAY')) {
            document.getElementById('show-saturday').checked = true;
        }
        history.replaceState(null, '', `?classId=${classId}`);
        draw();
    }

    function draw() {
        const days = visibleDays();
        let html = `<thead><tr><th class="tt-slot">Slot</th>${days.map(d => `<th>${DAY_LABEL[d]}</th>`).join('')}</tr></thead><tbody>`;
        for (let slot = 1; slot <= slotCount; slot++) {
            const times = slotTimes(slot);
            html += `<tr><td class="tt-slot"><strong>${slot}</strong>
                        <div class="small muted">${times.start ? `${times.start}–${times.end}` : ''}</div></td>`;
            for (const day of days) {
                html += `<td>${cellHtml(day, slot)}</td>`;
            }
            html += '</tr>';
        }
        html += '</tbody>';
        document.getElementById('grid').innerHTML = html;
        UI.icons();
    }

    function cellHtml(day, slot) {
        const entries = entriesIn(day, slot);
        const theory = entries.find(e => e.sessionType === 'THEORY');
        if (theory) {
            return entryButton(theory);
        }
        let html = '';
        if (entries.length > 0) {
            // labs: one line per batch, free batches shown as "free"
            for (const b of tt.batches) {
                const lab = entries.find(e => e.batchId === b.id);
                html += lab ? entryButton(lab) : `<div class="tt-free">${esc(b.name)} free</div>`;
            }
        }
        const freeBatches = tt.batches.filter(b => !entries.some(e => e.batchId === b.id));
        if (entries.length === 0 || freeBatches.length > 0) {
            html += `<button type="button" class="tt-add" data-day="${day}" data-slot="${slot}" aria-label="Add to ${DAY_LABEL[day]} slot ${slot}">
                        <i data-lucide="plus"></i>${entries.length ? 'Lab' : 'Add'}</button>`;
        }
        return html;
    }

    function entryButton(e) {
        const isLab = e.sessionType === 'LAB';
        return `
            <button type="button" class="tt-entry ${isLab ? 'tt-lab' : ''}" data-entry="${e.id}">
                <span class="tt-title">${isLab ? `<span class="tt-batch">${esc(e.batchName)}</span>` : ''}${esc(e.subjectCode)}
                    <span class="tt-type">${isLab ? 'Lab' : 'Theory'}</span></span>
                <span class="tt-meta">${esc(e.teacherName)}${e.room ? ` · ${esc(e.room)}` : ''}</span>
            </button>`;
    }

    // ------------------------------------------------------------ the entry form

    function subjectOptions(type, selectedId) {
        const usable = subjects.filter(s => type === 'THEORY' ? s.hasTheory : s.hasLab);
        return usable.map(s => `<option value="${s.id}" ${s.id === selectedId ? 'selected' : ''}>${esc(s.code)} – ${esc(s.name)}</option>`).join('');
    }

    function openEntryForm(entry, day, slot) {
        const existing = entriesIn(day, slot);
        const freeBatch = tt.batches.find(b => !existing.some(e => e.batchId === b.id));
        const e = entry || {
            dayOfWeek: day, slotNo: slot,
            startTime: slotTimes(slot).start, endTime: slotTimes(slot).end,
            sessionType: existing.length ? 'LAB' : 'THEORY',
            batchId: existing.length && freeBatch ? freeBatch.id : null,
            subjectId: null, teacherId: null, room: '',
        };

        const { form } = UI.formDialog({
            title: entry ? 'Edit timetable entry' : 'Add to timetable',
            body: `
                <div class="form-row">
                    <div class="field">
                        <label for="dayOfWeek">Day</label>
                        <select class="input" id="dayOfWeek" name="dayOfWeek">
                            ${DAYS.map(d => `<option value="${d}" ${d === e.dayOfWeek ? 'selected' : ''}>${DAY_LABEL[d]}</option>`).join('')}
                        </select>
                    </div>
                    <div class="field">
                        <label for="slotNo">Slot</label>
                        <input class="input" id="slotNo" name="slotNo" type="number" min="1" max="12" value="${e.slotNo}">
                    </div>
                </div>
                <div class="form-row">
                    <div class="field">
                        <label for="startTime">Start</label>
                        <input class="input" id="startTime" name="startTime" type="time" value="${hhmm(e.startTime)}">
                    </div>
                    <div class="field">
                        <label for="endTime">End</label>
                        <input class="input" id="endTime" name="endTime" type="time" value="${hhmm(e.endTime)}">
                    </div>
                </div>
                <div class="field">
                    <label>Type</label>
                    <label class="check"><input type="radio" name="sessionType" value="THEORY" ${e.sessionType === 'THEORY' ? 'checked' : ''}>Theory (whole class)</label>
                    <label class="check"><input type="radio" name="sessionType" value="LAB" ${e.sessionType === 'LAB' ? 'checked' : ''}>Lab (one batch)</label>
                </div>
                <div class="field" id="batch-field">
                    <label for="batchId">Batch</label>
                    <select class="input" id="batchId" name="batchId">
                        ${tt.batches.map(b => `<option value="${b.id}" ${b.id === e.batchId ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}
                    </select>
                </div>
                <div class="field">
                    <label for="subjectId">Subject</label>
                    <select class="input" id="subjectId" name="subjectId"></select>
                </div>
                <div class="field">
                    <label for="teacherId">Teacher</label>
                    <select class="input" id="teacherId" name="teacherId">
                        <option value="">Choose a teacher</option>
                        ${teachers.map(t => `<option value="${t.id}" ${t.id === e.teacherId ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}
                    </select>
                </div>
                <div class="field">
                    <label for="room">Room</label>
                    <input class="input" id="room" name="room" maxlength="30" value="${esc(e.room || '')}" placeholder="Room 301 / Lab 2">
                </div>
                ${entry ? `<button type="button" class="btn btn-danger btn-sm" id="delete-entry"><i data-lucide="trash-2"></i>Delete entry</button>` : ''}`,
            onSubmit: (form) => save(form, entry, false),
        });

        // Theory/Lab switch: show the batch field only for labs and list only matching subjects.
        const updateType = () => {
            const type = form.sessionType.value;
            const current = Number(form.subjectId.value) || e.subjectId;
            form.querySelector('#batch-field').hidden = type !== 'LAB';
            form.subjectId.innerHTML = '<option value="">Choose a subject</option>' + subjectOptions(type, current);
        };
        form.querySelectorAll('[name=sessionType]').forEach(r => r.addEventListener('change', updateType));
        updateType();

        // Changing the slot fills in that slot's usual times.
        form.slotNo.addEventListener('change', () => {
            const t = slotTimes(Number(form.slotNo.value));
            if (t.start) { form.startTime.value = t.start; form.endTime.value = t.end; }
        });

        if (entry) {
            form.querySelector('#delete-entry').addEventListener('click', async () => {
                const what = `${entry.subjectCode} ${entry.sessionType === 'LAB' ? 'lab (' + entry.batchName + ')' : 'theory'}`;
                if (await UI.confirm(`Delete ${what} on ${DAY_LABEL[entry.dayOfWeek]}, slot ${entry.slotNo}? Attendance already taken is kept.`)) {
                    await UI.run(() => Api.del(`/api/admin/timetable/${entry.id}`), 'Entry deleted.');
                    form.closest('dialog').querySelector('[data-close]').click();
                    await loadTimetable();
                }
            });
        }
    }

    /** Sends the form. If the teacher is busy elsewhere, asks whether to save anyway. */
    async function save(form, entry, allowClash) {
        const type = form.sessionType.value;
        const body = {
            classId: tt.classId,
            dayOfWeek: form.dayOfWeek.value,
            slotNo: Number(form.slotNo.value),
            startTime: form.startTime.value || null,
            endTime: form.endTime.value || null,
            sessionType: type,
            batchId: type === 'LAB' ? Number(form.batchId.value) : null,
            subjectId: Number(form.subjectId.value) || null,
            teacherId: Number(form.teacherId.value) || null,
            room: form.room.value,
            allowClash,
        };
        try {
            if (entry) {
                await Api.put(`/api/admin/timetable/${entry.id}`, body);
            } else {
                await Api.post('/api/admin/timetable', body);
            }
        } catch (error) {
            if (error.status === 409 && error.data && error.data.clash) {
                const ok = await UI.confirm(error.message + ' Save anyway?',
                    { title: 'Teacher clash', confirmLabel: 'Save anyway', danger: false });
                if (ok) {
                    return save(form, entry, true);
                }
            }
            throw error;
        }
        UI.notice(entry ? 'Entry saved.' : 'Entry added.');
        await loadTimetable();
    }

    // ------------------------------------------------------------ events

    document.getElementById('grid').addEventListener('click', (event) => {
        const entryBtn = event.target.closest('[data-entry]');
        const addBtn = event.target.closest('.tt-add');
        if (entryBtn) {
            const e = tt.entries.find(x => x.id === Number(entryBtn.dataset.entry));
            openEntryForm(e, e.dayOfWeek, e.slotNo);
        } else if (addBtn) {
            openEntryForm(null, addBtn.dataset.day, Number(addBtn.dataset.slot));
        }
    });

    document.getElementById('class-select').addEventListener('change', () => { slotCount = 0; loadTimetable(); });
    document.getElementById('show-saturday').addEventListener('change', draw);
    document.getElementById('add-slot-btn').addEventListener('click', () => {
        if (slotCount >= 12) { UI.notice('At most 12 slots.', 'error'); return; }
        slotCount++;
        draw();
    });

    (async () => {
        await Layout.init('timetable', { adminOnly: true });
        [classes, subjects, teachers] = await Promise.all([
            Api.get('/api/admin/classes'), Api.get('/api/admin/subjects'), Api.get('/api/admin/teachers'),
        ]);
        if (classes.length === 0) {
            document.querySelector('.card').innerHTML = '<div class="empty">Add a class first.</div>';
            return;
        }
        const select = document.getElementById('class-select');
        select.innerHTML = classes.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
        const wanted = UI.queryParam('classId');
        if (wanted && classes.some(c => String(c.id) === wanted)) select.value = wanted;
        await loadTimetable();
    })();
</script>
</body>
</html>
