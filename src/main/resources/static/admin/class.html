<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2F5D50">
    <link rel="icon" type="image/png" href="/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Attendance">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script src="/js/pwa.js" defer></script>
    <title>Class · Attendance Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="main">
    <a class="back-link" href="/admin/classes.html"><i data-lucide="arrow-left"></i>Classes</a>
    <div class="page-header">
        <div>
            <h1 id="class-name">Class</h1>
            <p id="class-summary"></p>
        </div>
        <a class="btn" id="timetable-link" href="#"><i data-lucide="table"></i>Timetable</a>
    </div>

    <section class="section card">
        <div class="section-head">
            <h2>Batches</h2>
            <button class="btn btn-sm" id="add-batch-btn" type="button"><i data-lucide="plus"></i>Add batch</button>
        </div>
        <div class="chips" id="batches"></div>
    </section>

    <section class="section">
        <div class="section-head">
            <h2>Students</h2>
            <div class="toolbar">
                <input class="input" id="search" type="search" placeholder="Search name or roll no." aria-label="Search students">
                <select class="input" id="batch-filter" aria-label="Filter by batch"></select>
                <button class="btn" id="upload-btn" type="button"><i data-lucide="upload"></i>Upload</button>
                <button class="btn btn-primary" id="add-student-btn" type="button"><i data-lucide="plus"></i>Add student</button>
            </div>
        </div>
        <div class="card flush">
            <div class="table-wrap">
                <table class="table">
                    <thead>
                    <tr><th>Roll No</th><th>Name</th><th>Batch</th><th class="actions"></th></tr>
                    </thead>
                    <tbody id="students"></tbody>
                </table>
            </div>
        </div>
    </section>
</main>

<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js" integrity="sha384-ieG+IKD0d/ZPXyCBTMVAbqsQdns8QGJR/e26WMw7M4fkaI/rHcS/YIoi+ah9WGge" crossorigin="anonymous"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/pages/admin-class.js"></script>
</body>
</html>
