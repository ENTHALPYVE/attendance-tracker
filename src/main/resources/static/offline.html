<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2F5D50">
    <link rel="icon" type="image/png" href="/icons/favicon-32.png">
    <title>Offline · Attendance Tracker</title>
    <link rel="stylesheet" href="/css/app.css">
    <script src="/js/pwa.js" defer></script>
</head>
<body>
<main class="login-page">
    <div class="card login-card">
        <img class="login-mark" src="/icons/icon-192.png" alt="">
        <h1>No connection</h1>
        <p class="muted">Attendance Tracker needs the college network or mobile data to load and save attendance.
            Nothing is saved while you are offline.</p>
        <button class="btn btn-primary btn-block" type="button" data-reload>Try again</button>
    </div>
</main>
</body>
</html>
