spring.application.name=attendance-tracker

# Every value in ${NAME:default} form can be set from an environment variable on the server
# (e.g. on Railway). The default after the colon is used when running on your own computer.
# Your own MySQL password goes in ./local.properties (git-ignored, read by the line below), see README.
spring.config.import=optional:file:./local.properties

server.port=${PORT:8080}

# ---------- MySQL ----------
# Railway's MySQL service provides MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER and MYSQLPASSWORD.
# The database is created automatically if it does not exist.
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:attendance_tracker}?createDatabaseIfNotExist=true&serverTimezone=Asia/Kolkata&rewriteBatchedStatements=true
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
# Few connections are enough, and free database plans limit how many are allowed.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
# If the database is down, give up after 10 s (the user sees "database cannot be reached")
# instead of hanging for 30 s. Broken connections are tested and replaced automatically,
# so the app recovers by itself when the database is back - no restart needed.
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.max-lifetime=1500000

# ---------- Schema ----------
# Tables are created by src/main/resources/schema.sql (CREATE TABLE IF NOT EXISTS),
# so Hibernate must not create or change tables itself.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Demo data ----------
# When true and the users table is empty, DataSeeder fills the database with
# 1 admin, 8 teachers, class SE-CO-A, a timetable and ~6 weeks of attendance.
# On a public server set ADMIN_PASSWORD and TEACHER_PASSWORD to your own secret values.
app.seed-demo-data=${SEED_DEMO_DATA:true}
app.seed.admin-password=${ADMIN_PASSWORD:admin123}
app.seed.teacher-password=${TEACHER_PASSWORD:teacher123}

# ---------- Uploads (student Excel / CSV) ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---------- Session ----------
server.servlet.session.timeout=8h
# Behind a hosting proxy (HTTPS outside, HTTP inside): trust its X-Forwarded-* headers so that
# cookies and redirects use https. Set COOKIE_SECURE=true on the server so cookies only travel over HTTPS.
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
